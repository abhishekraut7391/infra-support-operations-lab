name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Check shell syntax
        run: bash -n scripts/server_health_check.sh scripts/check_connectivity.sh
      - name: Run log analyzer on the sample log
        run: python scripts/log_analyzer.py sample_logs/sample_system.log
